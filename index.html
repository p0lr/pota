<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ham Radio Log Mapper</title>
  <style>
    body {
      background: #181a1b;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      margin: 0;
    }
    #container {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }
    h1 {
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 1.5em;
      text-align: center;
    }
    #controls {
      position: fixed;
      top: 32px;
      left: 32px;
      background: rgba(0,0,0,0.7);
      padding: 14px 24px;
      border-radius: 14px;
      box-shadow: 0 4px 32px #000b, 0 0 24px #00f2;
      display: flex;
      gap: 16px;
      z-index: 10;
      align-items: center;
      justify-content: flex-start;
      backdrop-filter: blur(2px);
    }
    input[type="file"] {
      color: #e0e0e0;
      background: #23272a;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 0.4em 0.8em;
    }
    button {
      background: #ffd700;
      color: #23272a;
      border: none;
      padding: 0.5em 1.5em;
      border-radius: 5px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #globe {
      width: 100vw;
      height: 100vh;
      margin: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }
  </style>
    <style>
      /* Subtle star field background for space effect */
      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 0;
        pointer-events: none;
        background: repeating-radial-gradient(circle at 20% 30%, #fff2 0, #fff0 2px, #000 3px, #000 100%),
                    repeating-radial-gradient(circle at 70% 80%, #fff1 0, #fff0 1.5px, #000 2.5px, #000 100%),
                    repeating-radial-gradient(circle at 50% 50%, #fff3 0, #fff0 1.2px, #000 2px, #000 100%);
        opacity: 0.7;
      }
    </style>
</head>
<body>
  <div id="container">
    <div id="controls">
      <input type="file" id="adiFile" accept=".adi,.adif,.txt" />
      <button id="mapBtn" disabled>Map</button>
    </div>
    <div id="globe"></div>
  </div>
  <script src="https://unpkg.com/globe.gl@2.32.6/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
