<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADI Globe Mapper</title>
  <style>
    body {
      background: #181a1b;
      color: #e0e0e0;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      margin: 0;
    }
    #container {
      max-width: 900px;
      margin: 2em auto;
      padding: 2em;
      background: #23272a;
      border-radius: 12px;
      box-shadow: 0 2px 16px #000a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      color: #ffd700;
      font-weight: 600;
      margin-bottom: 1.5em;
      text-align: center;
    }
    .controls {
      display: flex;
      gap: 1em;
      align-items: center;
      justify-content: center;
    }
    input[type="file"] {
      color: #e0e0e0;
      background: #23272a;
      border: 1px solid #444;
      border-radius: 5px;
      padding: 0.4em 0.8em;
    }
    button {
      background: #ffd700;
      color: #23272a;
      border: none;
      padding: 0.5em 1.5em;
      border-radius: 5px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #globe {
      width: 100%;
      max-width: 800px;
      height: 600px;
      margin-top: 2em;
      border-radius: 10px;
      background: #181a1b;
      box-shadow: 0 1px 8px #0006;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
    <style>
      /* Subtle star field background for space effect */
      body::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 0;
        pointer-events: none;
        background: repeating-radial-gradient(circle at 20% 30%, #fff2 0, #fff0 2px, #000 3px, #000 100%),
                    repeating-radial-gradient(circle at 70% 80%, #fff1 0, #fff0 1.5px, #000 2.5px, #000 100%),
                    repeating-radial-gradient(circle at 50% 50%, #fff3 0, #fff0 1.2px, #000 2px, #000 100%);
        opacity: 0.7;
      }
    </style>
</head>
<body>
  <div id="container">
    <h1>ADI Globe Mapper</h1>
    <div class="controls">
      <input type="file" id="adiFile" accept=".adi,.adif,.txt" />
      <button id="mapBtn" disabled>Map</button>
    </div>
    <div id="globe"></div>
  </div>
  <script src="https://unpkg.com/globe.gl@2.32.6/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
