<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADI Globe Mapper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <h1>ADI Globe Mapper</h1>
    <div class="controls">
      <input type="file" id="adiFile" accept=".adi,.adif,.txt" />
      <button id="mapBtn" disabled>Map</button>
    </div>
    <div id="globe"></div>
  </div>
  <script src="https://unpkg.com/three@0.150.1/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.32.6/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
