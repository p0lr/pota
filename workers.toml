# Cloudflare Workers deployment configuration
# Replace placeholders (e.g. <ACCOUNT_ID>) with your Cloudflare details.

name = "pota"
# Set to true to deploy to workers.dev subdomain for testing
workers_dev = true
# Replace with your Cloudflare account ID
account_id = "<ACCOUNT_ID>"
# Optional: set a route and zone_id to deploy to a specific hostname
route = ""
zone_id = ""

# Use the current date for compatibility date; update as appropriate
compatibility_date = "2025-12-26"
compatibility_flags = []

# Type: "javascript" or "esm" depending on your Worker code/bundler
type = "javascript"

[build]
# Build command run before publishing (adjust if you don't use npm)
command = "npm install && npm run build"

# If you want to serve static files from a Workers Site (legacy), set [site]
# For a simple static site, set bucket to the directory containing index.html
[site]
bucket = "./"
entry-point = "workers-site"

# If you use modules/entry module, point to your script file
# main = "app.js"  # uncomment and set if deploying a single script

# Notes:
# - If you prefer using Wrangler, consider renaming this to `wrangler.toml` and
#   using the Wrangler configuration format described by Cloudflare.
# - Replace <ACCOUNT_ID> with your Cloudflare account id and set `route`/`zone_id`
#   if you want route-based deployment instead of `workers_dev`.
